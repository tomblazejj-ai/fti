# FTI bez zapnutého PC (krok C1). Každých 30 minut na serverech GitHubu:
#   data ze stejných zdrojů jako aplikace na PC → výpočty → AI (Groq Free, jen při změně dat, nejvýš 6 komplexních
#   analýz denně) → výsledky do cloudu FTI (Cloudflare Worker + D1, Free) a jako záloha na GitHub Pages.
# Žádné heslo ke cloudu v GitHubu: odeslání se prokazuje krátkodobým tokenem GitHubu (OIDC), Worker ověřuje podpis,
# repozitář a větev. Klíč Groq je šifrovaný GitHub Secret GROQ_API_KEY; bez něj vše běží, jen AI se přeskočí.
# Veřejné repozitáře mají GitHub Actions i Pages zdarma; Cloudflare Workers + D1 jsou v bezplatném tarifu bez karty.
name: Mobilni verze

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # one data cycle at a time; it never waits for the backup site (a Pages deployment stuck in "waiting" on 9. 11. 2026
    # blocked every cycle behind it when both shared one queue)
    concurrency:
      group: fti-cycle
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Python knihovny (bez desktopového okna, PyTorch jen pro CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          grep -v -i '^pywebview' backend/requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt

      - name: Překladový model angličtina → čeština (z mezipaměti)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-cs-v1

      - name: Instalace překladového modelu (jen poprvé)
        run: |
          python - <<'EOF'
          import argostranslate.package as p, argostranslate.translate as t
          if not any(l.code == "cs" for l in t.get_installed_languages()):
              p.update_package_index()
              pkg = next(x for x in p.get_available_packages() if x.from_code == "en" and x.to_code == "cs")
              p.install_from_path(pkg.download())
          EOF

      - name: Stav z minulého běhu (databáze, historie skóre, kalendář)
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/fti.db
            backend/cache
          key: fti-state-${{ github.run_id }}
          restore-keys: fti-state-

      - name: Nastavení cloudu (žádné tajné údaje)
        working-directory: backend
        run: |
          cat > fti_settings.json <<'JSON'
          {"ai": {"provider": "groq", "auto_analyses": true, "daily_request_cap": 80, "daily_token_cap": 100000, "per_minute_cap": 6},
           "cloud": {"enabled": true, "url": "${{ vars.FTI_CLOUD_URL || 'https://fti.tomblazejj.workers.dev' }}"}}
          JSON

      - name: Data, výpočty a AI (stejný kód jako na PC)
        working-directory: backend
        env:
          FTI_DISABLE_SCHEDULER: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m app.cloud.run ../site --compute

      - name: Uložit stav pro příští běh
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            backend/fti.db
            backend/cache
          key: fti-state-${{ github.run_id }}

      - name: Výsledky do cloudu FTI (Cloudflare D1, přihlášení tokenem GitHubu)
        id: cloud
        continue-on-error: true
        working-directory: backend
        run: |
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=fti-cloud" \
            | python -c "import json, sys; print(json.load(sys.stdin)['value'])")
          echo "::add-mask::$TOKEN"
          FTI_SYNC_TOKEN="$TOKEN" python -m app.cloud.run ../site --upload

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Webová aplikace
        working-directory: frontend
        env:
          VITE_STATIC: "1"
        run: |
          npm install --no-audit --no-fund
          npx vite build --outDir ../site --emptyOutDir false

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Cloud FTI nedostal výsledky — GitHub to ohlásí jako chybný běh
        if: steps.cloud.outcome == 'failure'
        run: exit 1

  deploy:
    needs: build
    if: ${{ !cancelled() }}  # the backup site goes out even when only the cloud upload failed
    runs-on: ubuntu-latest
    # its own queue: a newer backup site replaces one still waiting, and nothing here can hold up the data cycle
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
